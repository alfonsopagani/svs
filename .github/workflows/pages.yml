name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine last material update
        shell: bash
        run: |
          LAST_UPDATE=$(git log -1 \
            --date=format:'%d/%m/%Y' \
            --format='%ad' \
            -- book/ slides/ codes/ \
            ':(exclude)book/index.md' \
            ':(exclude)book/README.md' \
            ':(exclude)slides/index.md' \
            ':(exclude)slides/README.md' \
            ':(exclude)codes/index.md' \
            ':(exclude)codes/README.md')

          mkdir -p _data
          printf 'last_update: "%s"\n' "$LAST_UPDATE" > _data/materials.yml

          echo "Ultimo aggiornamento materiali: $LAST_UPDATE"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
